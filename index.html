<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Particles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root { --bg:#0b1020; --fg:#e8ecff; --muted:#8a93b8; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:"Space Grotesk",system-ui,sans-serif; }
  #bg { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hero { position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 8vw; pointer-events:none; }
  h1 { font-size:clamp(2.2rem,6vw,4.5rem); margin:0 0 .6rem; letter-spacing:-.02em; }
  p { font-family:"JetBrains Mono",monospace; color:var(--muted); font-size:clamp(.9rem,1.6vw,1.1rem); margin:0; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main class="hero">
  <h1>Muhammad Umair</h1>
  <p>&lt;SeniorFrontendEngineer stack="Vue · React · React Native" /&gt;</p>
</main>

<script>
/* CodeParticles v2: smooth. Glyphs are pre-rendered sprites, motion is delta-time based. */
class CodeParticles {
  constructor(canvas, opts = {}) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d');
    this.o = Object.assign({
      colors: ['#5eead4', '#818cf8', '#38bdf8', '#c4b5fd'],
      words: ['{ }', '</>', '=>', '( )', '[ ]', '0', '1', 'AI', 'LLM', 'API', 'git', 'npm',
              'const', 'async', 'await', 'useState', 'Vue', 'React', 'TS', '&&', '//', '#', '::', 'fn()'],
      shapes: ['arrow', 'chevron', 'node', 'plus', 'cursor'],
      shapeRatio: 0.3,
      density: 16000,
      maxParticles: 90,   // keep this fixed when adding more words
      speed: 0.25,
      linkDistance: 130,
      mouseRadius: 160,
      font: '"JetBrains Mono", ui-monospace, monospace',
    }, opts);
    this.mouse = { x: -9999, y: -9999 };
    this.sprites = new Map();
    this.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.running = false;
    this._resize = () => this.resize();
    this._move = e => { const r = this.c.getBoundingClientRect(); this.mouse.x = e.clientX - r.left; this.mouse.y = e.clientY - r.top; };
    this._leave = () => { this.mouse.x = this.mouse.y = -9999; };
    this._vis = () => (document.hidden ? this.stop() : this.start());
    addEventListener('resize', this._resize);
    addEventListener('pointermove', this._move);
    addEventListener('pointerleave', this._leave);
    document.addEventListener('visibilitychange', this._vis);
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { this.sprites.clear(); });
    this.resize();
    this.start();
  }
  rand(a, b) { return a + Math.random() * (b - a); }
  pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  resize() {
    this.dpr = Math.min(devicePixelRatio || 1, 2);
    this.w = this.c.clientWidth; this.h = this.c.clientHeight;
    this.c.width = this.w * this.dpr; this.c.height = this.h * this.dpr;
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.sprites.clear();
    const n = Math.min(this.o.maxParticles, Math.round(this.w * this.h / this.o.density));
    this.p = Array.from({ length: n }, () => this.make());
    if (this.reduce) this.frame(0);
  }

  make() {
    const isShape = Math.random() < this.o.shapeRatio;
    const depth = this.rand(0.45, 1);
    const a = this.rand(0, 6.283), v = this.o.speed * depth * this.rand(0.5, 1);
    return {
      x: this.rand(0, this.w), y: this.rand(0, this.h),
      bx: Math.cos(a) * v, by: Math.sin(a) * v,      // base (cruise) velocity
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      kind: isShape ? this.pick(this.o.shapes) : null,
      text: isShape ? null : this.pick(this.o.words),
      size: Math.round(this.rand(11, 20) * depth / 2) * 2,   // quantized => few sprites
      depth,
      rot: this.rand(0, 6.283), vr: this.rand(-0.0025, 0.0025),
      ph: this.rand(0, 6.283), sf: this.rand(0.0003, 0.0007), sa: this.rand(2, 6), // smooth sway
      color: this.pick(this.o.colors),
    };
  }

  sprite(text, color, size) {
    const key = text + '|' + color + '|' + size;
    let s = this.sprites.get(key);
    if (s) return s;
    const d = this.dpr, m = document.createElement('canvas').getContext('2d');
    m.font = `${size}px ${this.o.font}`;
    const w = Math.ceil(m.measureText(text).width) + 8, h = size + 10;
    const cv = document.createElement('canvas');
    cv.width = w * d; cv.height = h * d;
    const g = cv.getContext('2d');
    g.scale(d, d); g.font = m.font; g.fillStyle = color;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, h / 2 + 1);
    s = { cv, w, h };
    this.sprites.set(key, s);
    return s;
  }

  drawShape(k, s) {
    const g = this.ctx; g.beginPath();
    if (k === 'arrow') { g.moveTo(-s, 0); g.lineTo(s, 0); g.moveTo(s * .3, -s * .6); g.lineTo(s, 0); g.lineTo(s * .3, s * .6); }
    else if (k === 'chevron') { g.moveTo(-s * .5, -s * .7); g.lineTo(s * .5, 0); g.lineTo(-s * .5, s * .7); }
    else if (k === 'plus') { g.moveTo(-s * .7, 0); g.lineTo(s * .7, 0); g.moveTo(0, -s * .7); g.lineTo(0, s * .7); }
    else if (k === 'cursor') { g.rect(-s * .25, -s * .8, s * .5, s * 1.6); g.fill(); return; }
    else if (k === 'node') { g.arc(0, 0, s * .5, 0, 6.283); g.stroke(); g.beginPath(); g.arc(0, 0, s * .15, 0, 6.283); g.fill(); return; }
    g.stroke();
  }

  step(dt) {
    const { w, h } = this, m = this.mouse, R = this.o.mouseRadius;
    for (const p of this.p) {
      const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
      if (d < R && d > 0.01) {                       // smooth push, eased falloff
        const t = 1 - d / R, f = t * t * 0.08 * dt;
        p.vx += (dx / d) * f; p.vy += (dy / d) * f;
      }
      const k = 1 - Math.pow(0.97, dt);              // ease back to cruise speed
      p.vx += (p.bx - p.vx) * k; p.vy += (p.by - p.vy) * k;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.x < -40) p.x = w + 40; else if (p.x > w + 40) p.x = -40;
      if (p.y < -40) p.y = h + 40; else if (p.y > h + 40) p.y = -40;
    }
  }

  frame(now) {
    const g = this.ctx, P = this.p, L = this.o.linkDistance, m = this.mouse, R = this.o.mouseRadius;
    g.clearRect(0, 0, this.w, this.h);
    g.lineWidth = 1;
    for (let i = 0; i < P.length; i++) {
      for (let j = i + 1; j < P.length; j++) {
        const d = Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y);
        if (d < L) { g.globalAlpha = (1 - d / L) * 0.16; g.strokeStyle = P[i].color; g.beginPath(); g.moveTo(P[i].x, P[i].y); g.lineTo(P[j].x, P[j].y); g.stroke(); }
      }
    }
    for (const p of P) {
      const sx = p.x + Math.sin(now * p.sf + p.ph) * p.sa;          // continuous sway
      const sy = p.y + Math.cos(now * p.sf * 0.8 + p.ph) * p.sa;
      const dm = Math.hypot(sx - m.x, sy - m.y);
      const near = dm < R ? 1 - dm / R : 0;
      if (near) { g.globalAlpha = near * 0.35; g.strokeStyle = p.color; g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(sx, sy); g.stroke(); }
      g.globalAlpha = Math.min(1, 0.22 + p.depth * 0.3 + near * 0.6);
      if (p.kind) {
        g.fillStyle = g.strokeStyle = p.color; g.lineWidth = 1.4; g.lineCap = g.lineJoin = 'round';
        g.save(); g.translate(sx, sy); g.rotate(p.rot); this.drawShape(p.kind, p.size * .8); g.restore();
      } else {
        const s = this.sprite(p.text, p.color, p.size);
        g.drawImage(s.cv, sx - s.w / 2, sy - s.h / 2, s.w, s.h);   // no text rasterizing per frame
      }
    }
    g.globalAlpha = 1;
  }

  loop = (t) => {
    if (!this.running) return;
    const dt = Math.min((t - (this.last || t)) / 16.667, 3);        // delta-time, capped
    this.last = t;
    this.step(dt); this.frame(t);
    this.raf = requestAnimationFrame(this.loop);
  };
  start() { if (this.running || this.reduce) return; this.running = true; this.last = 0; this.raf = requestAnimationFrame(this.loop); }
  stop() { this.running = false; cancelAnimationFrame(this.raf); }
  destroy() {
    this.stop();
    removeEventListener('resize', this._resize); removeEventListener('pointermove', this._move);
    removeEventListener('pointerleave', this._leave); document.removeEventListener('visibilitychange', this._vis);
  }
}
new CodeParticles(document.getElementById('bg'));
</script>
</body>
</html>
